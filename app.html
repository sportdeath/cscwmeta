        const paperRoute = computed(() => paperId.value !== null);
        const homeTab = computed(() => routeAddress.value === "people" || editorRoute.value || profileRoute.value
          ? "people" : ["program", "papers"].includes(routeState.value.params?.get("tab")) || paperRoute.value
            ? "program" : "chat");
        const welcomeDismissed = ref(false);
        const onWelcomeRoute = computed(() => !routeAddress.value && homeTab.value === "chat");
        // A direct link to another view should not interrupt exploration later.
        watch([routeAddress, homeTab], ([address, tab]) => {
          if (address || tab !== "chat") welcomeDismissed.value = true;
        }, { immediate: true });
        const showWelcome = computed(() => onWelcomeRoute.value && !welcomeDismissed.value &&
          session.value !== undefined &&
          (session.value === null ||
            (!profilesLoading.value && !profilesError.value &&
              !latestProfiles.value.some((profile) =>
                profile.actor === session.value?.actor))));
        const welcomePrompt = ref(null);
        function dismissWelcomeOnOutsideClick(event) {
          if (showWelcome.value && !welcomePrompt.value?.contains(event.target))
            welcomeDismissed.value = true;
        }
        document.addEventListener("click", dismissWelcomeOnOutsideClick);
        onScopeDispose(() => document.removeEventListener("click", dismissWelcomeOnOutsideClick));
        function startIntroduction(event) {
          if (event.button !== 0 || event.metaKey || event.ctrlKey ||
            event.shiftKey || event.altKey) return;
          event.preventDefault();
          if (introLoginBusy.value) return;
          welcomeDismissed.value = true;
          introLoginError.value = "";
          if (session.value === null) {
            introLoginBusy.value = true;
            loginOnEditorRoute = true;
          }
          forwardNavigate(editorHref);
        }
        watch(session, (current) => { if (current) introLoginError.value = ""; });

        async function loadProgram() {
          programLoading.value = true;
          programError.value = "";
          try {
            const listResponse = await fetch(programListUrl);
            if (!listResponse.ok) throw new Error("Could not load the conference list.");
            const list = await listResponse.json();
            if (!Array.isArray(list)) throw new Error("The conference list changed format.");
            const record = list.find((item) =>
              item.conference?.shortName === "CSCW" &&
              item.conference?.year === 2026 &&
              item.publicationInfo?.publicationStatus === "PUBLISHED" &&
              item.publicationInfo?.isProgramEnabled
            );
            if (!record) throw new Error("The CSCW 2026 program is unavailable.");
            const { id } = record.conference;
            const { version } = record.publicationInfo;
            const response = await fetch(
              `https://files.sigchi.org/conference/cache/${id}/${version}/program`
            );
            if (!response.ok) throw new Error("Could not load the program.");
            const data = await response.json();
            if (!Array.isArray(data.rooms) || !Array.isArray(data.sessions)) {
              throw new Error("The program changed format.");
            }
            const offsetMinutes = data.conference?.timeZoneOffset;
            if (!Number.isFinite(offsetMinutes) || !data.conference?.timeZoneName) {
              throw new Error("The program time zone is unavailable.");
            }
            // SIGCHI encodes conference wall times as UTC milliseconds. Apply
            // its UTC offset to turn those values into actual instants.
            program.value = {
              ...data,
              sessions: data.sessions.map((item) => ({
                ...item,
                startDate: Number.isFinite(item.startDate)
                  ? item.startDate - offsetMinutes * 60000 : item.startDate,
                endDate: Number.isFinite(item.endDate)
                  ? item.endDate - offsetMinutes * 60000 : item.endDate,
              })),
            };
          } catch (error) {
            programError.value = error.message || "Could not load program.";
          } finally {
            programLoading.value = false;
          }
        }

        const actualNow = ref(Date.now());
        const clockInterval = setInterval(() => { actualNow.value = Date.now(); }, 30000);
        onScopeDispose(() => clearInterval(clockInterval));
        const conferenceTimeZone = computed(() =>
          program.value?.conference?.timeZoneName || "America/Denver");

        function timeUntil(timestamp) {
          const minutes = Math.max(1, Math.ceil((timestamp - actualNow.value) / 60000));
          if (minutes < 60) return `${minutes} ${minutes === 1 ? "min" : "mins"}`;
          const hours = Math.floor(minutes / 60);
          const remainingMinutes = minutes % 60;
          if (hours < 24) return `${hours} ${hours === 1 ? "hr" : "hrs"}` +
            (remainingMinutes ? ` ${remainingMinutes} ${remainingMinutes === 1 ? "min" : "mins"}` : "");
          const days = Math.floor(hours / 24);
          const remainingHours = hours % 24;
          return `${days} ${days === 1 ? "day" : "days"}` +
            (remainingHours ? ` ${remainingHours} ${remainingHours === 1 ? "hr" : "hrs"}` : "");
        }
        const roomViews = computed(() => {
          const data = program.value;
          if (!data) return [];
          const sessionsByRoom = new Map();
          for (const session of data.sessions) {
            if (!session.roomId || !Number.isFinite(session.startDate) ||
              !Number.isFinite(session.endDate)) continue;
            if (!sessionsByRoom.has(session.roomId)) sessionsByRoom.set(session.roomId, []);
            sessionsByRoom.get(session.roomId).push(session);
          }
          return data.rooms.flatMap((room) => {
            const sessions = sessionsByRoom.get(room.id);
            if (!sessions?.length) return [];
            sessions.sort((a, b) => a.startDate - b.startDate);
            const current = sessions.find((session) =>
              session.startDate <= actualNow.value && actualNow.value < session.endDate
            );
            const last = sessions.filter((session) => session.endDate <= actualNow.value)
              .sort((a, b) => a.endDate - b.endDate).at(-1);
            const next = sessions.find((session) => session.startDate > actualNow.value);
            return [{ ...room, sessions, current, last, next }];
          });
        });
        const activeRooms = computed(() => roomViews.value
          .filter((room) => room.current)
          .sort((a, b) => a.name.localeCompare(b.name)));
        const inactiveRooms = computed(() => roomViews.value
          .filter((room) => !room.current)
          .sort((a, b) => (b.last?.endDate || 0) - (a.last?.endDate || 0) ||
            (a.next?.startDate || Infinity) - (b.next?.startDate || Infinity) ||
            a.name.localeCompare(b.name)));
        const routeRoomId = computed(() => {
          const match = /^room\/(\d+)$/.exec(routeAddress.value);
          return match ? Number(match[1]) : null;
        });
        const selectedRoom = computed(() => roomViews.value.find((room) =>
          room.id === routeRoomId.value
        ));
        const selectedTitle = computed(() => routeAddress.value === "hallway"
          ? "The Hallway Track"
          : selectedRoom.value?.current?.name || selectedRoom.value?.name || "");
        const selectedHref = computed(() => routeAddress.value === "hallway"
          ? "?/hallway" : selectedRoom.value ? `?/room/${selectedRoom.value.id}` : "");
        const selectedContext = computed(() => {
          const room = selectedRoom.value;
          if (!room) return null;
          return room.current
            ? { room: room.name, time: `${timeUntil(room.current.endDate)} left` }
            : { room: "No session in progress" };
        });
        const selectedSuggestions = computed(() =>
          selectedRoom.value?.current ? roomSuggestions : []);
        const selectedMarkers = computed(() => {
          const room = selectedRoom.value;
          const data = program.value;
          if (!room || !data) return [];
          const contentById = new Map((data.contents || []).map((item) => [item.id, item]));
          const contentTypesById = new Map((data.contentTypes || []).map((item) => [item.id, item]));
          const durationByType = new Map((data.contentTypes || []).map((item) =>
            [item.id, item.duration]));
          const markers = [];
          for (const session of room.sessions) {
            if (session.startDate > actualNow.value) break;
            const contents = (session.contentIds || [])
              .map((id) => contentById.get(id)).filter(Boolean);
            const durations = contents.map((item) =>
              item.durationOverride ?? durationByType.get(item.typeId ?? item.contentTypeId));
            // The feed has no talk start times. Infer them only when ordered
            // content durations exactly fill the session's scheduled time.
            const timedTalks = contents.length > 1 && !session.isParallelPresentation &&
              durations.every((duration) => Number.isFinite(duration) && duration > 0) &&
              durations.reduce((sum, duration) => sum + duration, 0) * 60000 ===
                session.endDate - session.startDate;
            const solePaper = contents.length === 1 &&
              isPaperLike(contents[0], contentTypesById)
              ? contents[0] : null;
            const sessionNamedForPaper = solePaper?.title?.trim() === session.name?.trim();
            markers.push({
              kind: "marker", key: `session:${session.id}`, time: session.startDate,
              label: "Session begins", title: session.name,
              paperId: sessionNamedForPaper ? solePaper.id : null,
              detail: timedTalks ? contents[0].title :
                sessionNamedForPaper ? "" : solePaper?.title || "",
              detailLabel: timedTalks ? "First talk" : "Presentation",
              detailPaperId: timedTalks ? contents[0].id : solePaper?.id || null,
            });
            if (!timedTalks) continue;
            let talkStart = session.startDate;
            for (let index = 1; index < contents.length; index++) {
              talkStart += durations[index - 1] * 60000;
              if (talkStart > actualNow.value) break;
              markers.push({
                kind: "marker", key: `talk:${session.id}:${contents[index].id}`,
                time: talkStart, label: "Talk begins", title: contents[index].title,
                paperId: contents[index].id,
              });
            }
          }
          return markers.sort((a, b) => a.time - b.time || a.key.localeCompare(b.key));
        });
        const selectedChannel = computed(() => routeAddress.value === "hallway"
          ? hallwayChannel : selectedRoom.value
            ? `cscw-meta:2026:room:${selectedRoom.value.id}:v1` : null);

        // The transclusion forwards document.title to the browser tab.
        const pageTitle = computed(() => {
          let name;
          if (editorRoute.value) {
            name = latestProfiles.value.some((profile) => profile.actor === session.value?.actor)
              ? "Edit profile" : "Introduce yourself";
          } else if (profileRoute.value) {
            name = latestProfiles.value.find((profile) =>
              profile.actor === profileActor.value)?.value.name || "Profile";
          } else if (paperRoute.value) {
            name = program.value?.contents?.find((item) => item.id === paperId.value)?.title || "Program";
          } else if (routeAddress.value === "hallway") {
            name = "The Hallway Track";
          } else if (routeRoomId.value !== null) {
            name = selectedTitle.value || "Room chat";
          } else {
            name = homeTab.value === "people" ? "People" :
              homeTab.value === "program" ? "Program" : "Chat";
          }
          return `${name} · CSCW Meta`;
        });
        watch(pageTitle, (value) => { document.title = value; }, { immediate: true });

        onMounted(() => { syncRoute(); loadProgram(); });
        return {
          program, programLoading, programError, loadProgram,
          profileObjects, latestProfiles, profilesLoading, profilesError,
          routeAddress, editorRoute, profileRoute, profileActor, homeTab,
          session, welcomeDismissed, welcomePrompt, showWelcome, editorHref,
          introLoginError, introLoginBusy, startIntroduction,
          paperId, paperRoute, paperSearch, paperBrowseState, actualNow,
          profileSaved, profileRemoved, profileBack, detailBack, rememberLink,
          forwardNavigate,
          chatNavigationState,
          routeRoomId, activeRooms, inactiveRooms,
          selectedTitle, selectedHref, selectedContext, selectedSuggestions,
          selectedMarkers, selectedChannel,
          conferenceTimeZone, timeUntil,
        };
      }

      createApp({
        template: "#app-template",
        components: { ChatRoom, PeopleDirectory, ProgramView },
        setup,
      })
        .use(GraffitiPlugin, { graffiti: new window.Graffiti() })
        .mount("#app");
    </script>
  </head>
  <body>
    <div id="app"><p>Loading…</p></div>

    <template id="app-template">
      <main @click.capture="rememberLink">
        <template v-if="!routeAddress || routeAddress === 'people' || editorRoute || profileRoute">
          <nav v-if="!editorRoute && !profileRoute" class="home-tabs" aria-label="Home sections">
            <a href="?/" :aria-current="homeTab === 'chat' ? 'page' : null">Chat</a>
            <a href="?/people" :aria-current="homeTab === 'people' ? 'page' : null">People</a>
            <a href="?tab=program" :aria-current="homeTab === 'program' ? 'page' : null">Program</a>
          </nav>
        <nav v-if="homeTab === 'chat'" class="room-browser" aria-label="Chat rooms">
          <h1>Happening now</h1>
          <ul class="room-list">
            <li><a href="?/hallway"><strong>The Hallway Track</strong></a></li>
            <li v-for="room in activeRooms" :key="room.id">
              <a :href="`?/room/${room.id}`">
                <strong>{{ room.current.name }}</strong>
                <small><span class="room-location"><svg viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" aria-hidden="true">
                  <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z" />
                  <circle cx="12" cy="10" r="2.5" />
                </svg>{{ room.name }}</span> · {{ timeUntil(room.current.endDate) }} left</small>
              </a>
            </li>
          </ul>
          <p v-if="programLoading" role="status">Loading rooms…</p>
          <p v-else-if="programError" role="status">
            {{ programError }} <button type="button" @click="loadProgram">Retry</button>
          </p>
          <template v-else-if="program">
            <p v-if="!activeRooms.length">No scheduled sessions in progress.</p>
            <details>
              <summary>Inactive rooms ({{ inactiveRooms.length }})</summary>
              <ul class="inactive-rooms">
                <li v-for="room in inactiveRooms" :key="room.id">
                  <a :href="`?/room/${room.id}`">
                    <strong v-if="room.last">{{ room.last.name }}</strong>
                    <strong v-else-if="room.next">{{ room.next.name }}</strong>
                    <small><span class="room-location"><svg viewBox="0 0 24 24" fill="none"
                      stroke="currentColor" stroke-width="2" stroke-linecap="round"
                      stroke-linejoin="round" aria-hidden="true">
                      <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z" />
                      <circle cx="12" cy="10" r="2.5" />
                    </svg>{{ room.name }}</span> · {{ room.last ? 'Last session' : 'Next session' }}</small>
                  </a>
                </li>
              </ul>
            </details>
          </template>
        </nav>
        <people-directory v-else-if="homeTab === 'people'" :program="program" :program-loading="programLoading"
          :program-error="programError" :editor-route="editorRoute"
          :profile-objects="profileObjects" :latest-profiles="latestProfiles"
          :profiles-loading="profilesLoading" :profiles-error="profilesError"
          :login-error="introLoginError" :login-busy="introLoginBusy"
          :profile-route="profileRoute" :profile-actor="profileActor"
          @saved="profileSaved" @removed="profileRemoved"
          @open-editor="forwardNavigate"
          @profile-back="profileBack" @detail-back="detailBack"></people-directory>
        <program-view v-else v-model:search="paperSearch" :program="program" :program-loading="programLoading"
          :program-error="programError" :profiles="latestProfiles"
          :profiles-loading="profilesLoading" :profiles-error="profilesError"
          :paper-id="null" :browse-state="paperBrowseState" :now="actualNow"></program-view>
        </template>
        <template v-else>
          <program-view v-if="paperRoute" :key="paperId" :search="paperSearch" :program="program"
            :program-loading="programLoading" :program-error="programError"
            :profiles="latestProfiles" :profiles-loading="profilesLoading"
            :profiles-error="profilesError" :paper-id="paperId"
            :browse-state="paperBrowseState" :now="actualNow"
            @detail-back="detailBack"></program-view>
          <!-- Key by channel so local chat state cannot leak between rooms. -->
          <chat-room v-else-if="selectedChannel" :key="selectedChannel"
            :channel="selectedChannel" :title="selectedTitle"
            :profiles="latestProfiles" :profiles-loading="profilesLoading"
            :profiles-error="profilesError"
            :href="selectedHref" back-href="?/"
            :context="selectedContext" :markers="selectedMarkers"
            :suggestions="selectedSuggestions"
            :marker-time-zone="conferenceTimeZone"
            :navigation-state="chatNavigationState" :autopoll="true"
            @detail-back="detailBack"></chat-room>
          <template v-else>
            <p><a href="?/">← Back to rooms</a></p>
            <p v-if="routeRoomId !== null && programLoading" role="status">Loading room…</p>
            <p v-else-if="routeRoomId !== null && programError" role="status">
              {{ programError }} <button type="button" @click="loadProgram">Retry</button>
            </p>
            <p v-else role="status">Room not found.</p>
          </template>
        </template>
        <div v-if="showWelcome" class="welcome-backdrop" aria-hidden="true"></div>
        <aside v-if="showWelcome" ref="welcomePrompt" class="welcome-prompt" aria-labelledby="welcome-title">
          <h2 id="welcome-title">Welcome to CSCW Meta!</h2>
          <p>Would you like to introduce yourself so that others can learn about your research and connect with you?</p>
          <div class="welcome-actions">
            <a class="introduce-button" :href="editorHref">
              {{ session === null ? 'Log in to introduce yourself' : 'Introduce yourself' }}
            </a>
            <button type="button" @click="welcomeDismissed = true">Not now</button>
          </div>
        </aside>
      </main>
    </template>

    <template id="people-directory-template">
      <section class="people-directory"
        :aria-label="editorRoute ? 'Profile editor' : profileRoute ? 'Profile' : 'People directory'">
        <header v-if="editorRoute" class="profile-page-header">
          <nav class="detail-nav" aria-label="Page navigation">
            <button class="chat-back" type="button" aria-label="Back" @click="goBackFromEditor"><span aria-hidden="true">←</span><span class="nav-label">Back</span></button>
            <a class="detail-home" href="?/" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg><span class="nav-label">Home</span></a>
          </nav>
          <h1>{{ myProfile ? 'Edit your profile' : 'Introduce yourself' }}</h1>
        </header>
        <header v-else-if="profileRoute" class="profile-page-header">
          <nav class="detail-nav" aria-label="Page navigation">
            <button class="chat-back" type="button" aria-label="Back" @click="goBackFromProfile"><span aria-hidden="true">←</span><span class="nav-label">Back</span></button>
            <a class="detail-home" href="?/" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg><span class="nav-label">Home</span></a>
          </nav>
        </header>
        <p v-if="notice" role="status">{{ notice }}</p>
        <p v-if="error || (editorRoute && loginError)" role="alert">{{ error || loginError }}</p>
        <button v-if="editorRoute && session === null" class="introduce-button"
          type="button" :disabled="loginBusy" @click="logIn">
          {{ loginBusy ? 'Logging in…' : 'Log in to introduce yourself' }}
        </button>
        <p v-else-if="editorRoute && isFirstPoll && !discoveryError" role="status">
          Loading profile…
        </p>

        <form v-if="editorRoute && editing" class="profile-form" @submit.prevent="saveProfile">
          <label>Name <small>(what you publish under)</small>
            <input ref="nameInput" v-model="name" type="text" autocomplete="name" maxlength="100" required>
          </label>
          <label class="profile-photo-picker">
            <span class="profile-avatar profile-photo-preview">
              <img v-if="photoPreview" :src="photoPreview" alt="Selected profile picture">
              <graffiti-get-media v-else-if="myProfile?.value['profile picture'] && !removePhoto"
                :url="myProfile.value['profile picture']"
                :accept="{ types: ['image/*'], maxBytes: maxPhotoBytes }" v-slot="{ media }">
                <img v-if="media" :src="media.dataUrl" alt="Current profile picture">
                <span v-else aria-hidden="true">{{ name.slice(0, 1) || '+' }}</span>
              </graffiti-get-media>
              <span v-else aria-hidden="true">+</span>
            </span>
            <span>{{ photoPreview || (myProfile?.value['profile picture'] && !removePhoto)
              ? 'Change profile picture' : 'Add profile picture (optional)' }}</span>
            <input ref="photoInput" class="profile-photo-input" type="file" accept="image/*"
              @change="selectPhoto">
          </label>
          <button v-if="photoPreview || (myProfile?.value['profile picture'] && !removePhoto)"
            type="button" @click="clearPhoto">Remove picture</button>
          <label>Pronouns (optional)
            <input v-model="pronouns" type="text" autocomplete="off" maxlength="50">
          </label>
          <label>What are your research interests? (1–2 sentences)
            <textarea v-model="interests" rows="3" maxlength="300" required></textarea>
          </label>
          <fieldset>
            <legend>Are you involved in anything on the program?</legend>
            <input v-model="presentationSearch" type="search" autocomplete="off"
              aria-label="Search program items" placeholder="Search titles or authors"
              :disabled="!program">
            <p v-if="programLoading" role="status">Loading program…</p>
            <p v-else-if="programError" role="status">Program search is unavailable right now.</p>
            <ul v-if="presentations.length">
              <li v-for="id in presentations" :key="id">
                <button class="paper-added" type="button" @click="removePresentation(id)"
                  :aria-label="`Remove ${presentationTitle(id)}`">Added</button>
                {{ presentationTitle(id) }}<small v-if="presentationAuthors(id)">
                  — {{ presentationAuthors(id) }}
                </small>
              </li>
            </ul>
            <ul v-if="presentationMatches.length">
              <li v-for="item in presentationMatches" :key="item.id">
                <button class="paper-add" type="button" @click="addPresentation(item)"
                  :aria-label="`Add ${item.title}`">Add</button>
                {{ item.title }}<small v-if="item.authors"> — {{ item.authors }}</small>
              </li>
            </ul>
            <p v-else-if="presentationSearch.trim().length >= 2 && program?.contents &&
              !matchingPresentations.length">No matches.</p>
          </fieldset>
          <fieldset>
            <legend>Are you interested in meeting other researchers?</legend>
            <label><input v-model="openToMeeting" type="radio" name="open-to-meeting"
              :value="true" required> Yes! I want to meet other researchers</label>
            <label><input v-model="openToMeeting" type="radio" name="open-to-meeting"
              :value="false" required> No, not right now</label>
          </fieldset>
          <div v-if="openToMeeting === true">
            <label for="profile-contact">How should researchers reach out to you?</label>
            <small id="contact-help">
              You can share an email, messaging handle, or where to find you in person.
              What you write here will be public.
            </small>
            <textarea id="profile-contact" v-model="contact" rows="2" maxlength="300"
              required aria-describedby="contact-help"></textarea>
          </div>
          <div class="profile-form-actions">
            <button type="submit" :disabled="busy">{{ busy ? 'Saving…' : 'Save profile' }}</button>
          </div>
        </form>

        <template v-if="profileRoute">
          <p v-if="isFirstPoll && !discoveryError" role="status">Loading profile…</p>
          <p v-else-if="!selectedProfile && !discoveryError" role="status">Profile not found.</p>
          <article v-if="selectedProfile" class="profile-detail">
            <header class="profile-identity">
              <div class="profile-avatar">
                <graffiti-get-media v-if="selectedProfile.value['profile picture']"
                  :url="selectedProfile.value['profile picture']"
                  :accept="{ types: ['image/*'], maxBytes: maxPhotoBytes }"
                  v-slot="{ media }">
                  <img v-if="media" :src="media.dataUrl" alt="">
                  <span v-else aria-hidden="true">{{ selectedProfile.value.name.slice(0, 1) }}</span>
                </graffiti-get-media>
                <span v-else aria-hidden="true">{{ selectedProfile.value.name.slice(0, 1) }}</span>
              </div>
              <div>
                <h1>{{ selectedProfile.value.name }}
                  <small v-if="selectedProfile.value.pronouns">({{ selectedProfile.value.pronouns }})</small>
                </h1>
                <graffiti-actor-to-handle :actor="selectedProfile.actor" v-slot="{ handle }">
                  <small v-if="handle" class="profile-handle">@{{ handle.replace(/^@/, '') }}</small>
                </graffiti-actor-to-handle>
              </div>
            </header>
            <div v-if="selectedProfile.value['presentation IDs']?.length || selectedProfile.value['open to meeting']"
              class="profile-badges">
              <span v-if="selectedProfile.value['open to meeting']" class="meeting">🤝 Let's meet!</span>
              <span v-if="selectedProfile.value['presentation IDs']?.length" class="program">🗓️ On the program</span>
            </div>
            <section>
              <h2>Research interests</h2>
              <p><template v-for="(part, index) in researchParts(selectedProfile.value['research interests'])"

                    :accept="{ types: ['image/*'], maxBytes: maxPhotoBytes }"
                    v-slot="{ media }">
                    <img v-if="media" :src="media.dataUrl" alt="">

                  </graffiti-get-media>
                  <span v-else aria-hidden="true">{{ profileByActor.get(message.actor)?.value.name.slice(0, 1) }}</span>
                </a>
                <button v-if="message.actor === session?.actor" class="message-actions-trigger"
                  type="button" aria-label="Message actions" title="Message actions"
                  :aria-expanded="actionMenu?.message.key === message.key"
                  @click="openActionsFromButton(message, $event)">⋯</button>
                <article class="message-bubble" @pointerdown="startLongPress(message, $event)"
                  @pointermove="moveLongPress" @pointerup="clearLongPress"
                  @pointercancel="clearLongPress" @pointerleave="clearLongPress"
                  @selectstart="onMessageSelectStart(message, $event)"
                  @contextmenu="onMessageContextMenu(message, $event)">
                  <header>
                    <strong><a :href="profileHref(message.actor)">
                      {{ profileByActor.get(message.actor)?.value.name }}
                    </a></strong>
                  </header>
                  <p><template v-for="(part, index) in textParts(message.content)" :key="index"><a
                    v-if="isLink(part)" :href="part">{{ part }}</a><template
                    v-else>{{ part }}</template></template></p>
                  <footer>
                    <time :datetime="dateTime(message.time)">{{ formatTime(message.time) }}</time>
                    <span v-if="message.actor === session?.actor" class="delivery-status"
                      :class="message.status" :aria-label="deliveryLabel(message.status)"
                      :title="deliveryLabel(message.status)">
                      {{ message.status === 'sending' ? '' : message.status === 'failed' ? '!' : '✓' }}
                    </span>
                  </footer>
                  <small v-if="message.status === 'failed'" role="alert">
                    {{ message.error }}
                    <button type="button" :disabled="session?.actor !== message.actor"
                      @click="postMessage(message)">Retry</button>
                  </small>
                  <small v-if="deleteErrors.has(message.url)" role="alert">
                    {{ deleteErrors.get(message.url) }}
                  </small>
                </article>
              </li>
            </template>
          </ol>
        </section>

        <div v-if="actionMenu" class="message-scrim" aria-hidden="true"
          @click="closeActions" @wheel.prevent @touchmove.prevent></div>
        <div v-if="actionMenu" class="message-actions-menu"
          :style="{ left: actionMenu.left + 'px', top: actionMenu.top + 'px' }">
          <button ref="actionMenuButton" type="button"
            :disabled="actionMenu.message.status === 'sending' || deletingUrls.has(actionMenu.message.url)"
            @click="deleteFromMenu">Delete</button>
        </div>

        <div v-if="session && myProfile && !profilesError && !profilesLoading &&
          !draft.trim() && suggestions.length" class="chat-suggestions"
          ref="suggestionList" role="group" aria-label="Suggestions"
          :class="{ 'more-left': suggestionsMoreLeft, 'more-right': suggestionsMoreRight }"
          @scroll="updateSuggestionEdges">
          <span aria-hidden="true">Suggestions</span>
          <button v-for="suggestion in suggestions" :key="suggestion.label" type="button"
            @click="useSuggestion(suggestion)">{{ suggestion.label }}</button>
        </div>
        <form autocomplete="off" :class="{ 'composer-gate': !myProfile }"
          @submit.prevent="sendMessage">
          <span v-if="session === undefined">Checking your account…</span>
          <span v-else-if="session && profilesError">Could not load profiles. Retrying…</span>
          <span v-else-if="session && profilesLoading">Loading profiles…</span>
          <a v-else-if="!myProfile" :href="editorHref">{{ session === null
            ? 'Log in to introduce yourself' : 'Introduce yourself to chat' }}</a>
          <template v-else>
            <textarea ref="messageInput" v-model="draft" rows="1"
              aria-label="Message" placeholder="Message" autocomplete="off" maxlength="1000"
              enterkeyhint="send" @focus="closeActions" @input="resizeComposer"
              @keydown="onComposerKeydown"></textarea>
          </template>
        </form>
      </section>
    </template>
  </body>
</html>
