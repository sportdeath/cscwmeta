<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />

    <script src="https://social.wiki/init.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css" />
    <style>
      body { max-width: none; margin: 0; padding: 0; }

      .room-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); gap: .5rem; list-style: none; margin: 0; padding: 0; }

      .room-browser details { display: block; margin: .4rem 0 0; }
      .room-browser summary { border: 1px solid var(--border); border-radius: .35rem; }
      .people-directory { box-sizing: border-box; width: 100%; max-width: 50rem; margin: 0 auto; padding: 1rem; }
      .people-directory > header { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }

      .people-search { position: relative; margin-top: 1rem; }
      .people-search svg { position: absolute; top: 50%; left: .75rem; width: 1.1rem; height: 1.1rem; transform: translateY(-50%); pointer-events: none; }
      .people-search input { box-sizing: border-box; width: 100%; margin: 0; padding-left: 2.25rem; }
      .people-filters { display: flex; flex-wrap: wrap; gap: .35rem 1rem; margin: .5rem 0 0; padding: 0; border: 0; }
      .people-filters label { display: inline-flex; align-items: center; gap: .3rem; margin: 0; padding: .25rem .55rem; border: 1px solid; border-radius: 1rem; cursor: pointer; }
      .people-filters input { margin: 0; accent-color: var(--accent); }
      .people-filters label:has(input:checked) { background: color-mix(in srgb, var(--accent) 30%, var(--background)); box-shadow: inset 0 0 0 1px var(--accent); }
      .people-filters .meeting, .profile-badges .meeting { --accent: #16a085; }
      .people-filters .presenter, .profile-badges .presenter { --accent: #9b59b6; }
      .people-filters label, .profile-badges span { color: color-mix(in srgb, var(--accent) 72%, var(--text-main)); background: color-mix(in srgb, var(--accent) 18%, var(--background)); border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); }
      .introduce-button { box-sizing: border-box; display: block; width: 100%; margin: 1rem 0; padding: 1rem; border: 1px solid var(--links); border-radius: .4rem; background: var(--links); color: white; font-size: 1.1rem; text-align: center; text-decoration: none; }
      .profile-form { margin: 1rem 0; padding: 1rem; border: 1px solid var(--border); border-radius: .4rem; }
      .profile-form label { display: block; margin: .75rem 0; }
      .profile-form input:not([type="checkbox"]):not([type="radio"]):not([type="file"]), .profile-form textarea { box-sizing: border-box; width: 100%; }
      .profile-form input[type="checkbox"], .profile-form input[type="radio"] { width: auto; }
      .profile-form textarea { resize: vertical; }
      .profile-form fieldset { margin: .75rem 0; }
      .profile-form fieldset label { margin: 0; }
      .profile-form ul { margin: .5rem 0; padding-left: 1.25rem; }
      .profile-form li { margin: .25rem 0; }
      .profile-form li button { margin: 0 .35rem 0 0; }
      .profile-form .paper-add, .profile-form .paper-added { box-sizing: border-box; width: 4.75rem; padding: .25rem .4rem; text-align: center; white-space: nowrap; }
      .profile-form .paper-add { border: 1px solid var(--links); background: var(--links); color: white; }
      .profile-form .paper-added { border: 1px solid var(--border); background: var(--background-alt); color: var(--text-muted, #666); }
      .profile-form label[for="profile-contact"] { margin-bottom: .2rem; }
      #contact-help { display: block; margin-bottom: .5rem; }
      .profile-form label.profile-photo-picker { display: inline-flex; align-items: center; gap: .75rem; cursor: pointer; }
      .profile-photo-picker:focus-within .profile-photo-preview { outline: 2px solid var(--links); outline-offset: 2px; }
      .profile-photo-input { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      .profile-form-actions { display: flex; align-items: center; flex-wrap: wrap; gap: .5rem; }

      .profile-form-actions button[type="submit"] { box-sizing: border-box; flex: 1 0 100%; width: 100%; padding: .85rem 1rem; border: 1px solid var(--links); background: var(--links); color: white; font-size: 1.1rem; }
      .profile-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 20rem), 1fr)); gap: .75rem; list-style: none; margin: 1rem 0; padding: 0; }

      .profile-detail { margin-top: 1rem; }

      .profile-detail section p, .profile-detail section ul { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
      .profile-detail section p a { color: var(--links); text-decoration: underline; }
      .profile-detail section ul { padding-left: 1.25rem; }
      .profile-actions { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin-top: 1rem; }
      .profile-actions button { margin: 0; }
      .profile-actions .profile-edit { border: 1px solid var(--links); background: var(--links); color: white; }
      .profile-identity { display: flex; align-items: center; gap: .7rem; min-width: 0; }
      .profile-identity > div:last-child { min-width: 0; }
      .profile-identity h2 { margin: 0; font-size: 1.1rem; }
      .profile-identity h2 small { font-size: .8em; font-weight: normal; }
      .profile-handle { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-muted, #666); }
      .profile-badges { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .6rem; }
      .profile-badges span { padding: .1rem .45rem; border: 1px solid; border-radius: 1rem; font-size: .8rem; }
      .profile-avatar { display: grid; place-items: center; flex: none; width: 3rem; height: 3rem; overflow: hidden; border-radius: 50%; background: var(--background-body); font-size: 1.4rem; }
      .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
      .profile-photo-preview { width: 5rem; height: 5rem; border: 2px dashed var(--border); }
      .chat { flex: 0 0 100dvh; min-height: 0; display: flex; flex-direction: column; }
      .chat > header { padding: 1rem 1rem 0; }
      .chat-heading { display: flex; align-items: flex-start; gap: .6rem; }
      .chat-heading-content { flex: 1; min-width: 0; }
      .chat-heading h1 { --edge-fade: 1.25rem; margin: 0; overflow-x: auto; white-space: nowrap; scrollbar-width: none; font-size: 1.5rem; }
      .chat-heading h1 a { color: inherit; text-decoration: none; }
      .chat-back { flex: none; padding: .15rem .5rem; border: 1px solid var(--border); border-radius: .35rem; text-decoration: none; }
      .chat-context { display: flex; gap: .35rem; min-width: 0; margin: .1rem 0 .5rem; color: var(--text-muted, #666); font-size: .9rem; white-space: nowrap; }
      .chat-context span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      .chat-context span:last-child { flex: none; }
      .chat-log { flex: 1; min-height: 0; overflow-y: auto; scrollbar-gutter: stable; border-block: 1px solid var(--border); padding: .5rem 1rem; }
      .chat-log.menu-open { overflow-y: hidden; touch-action: none; }
      .messages { display: flex; flex-direction: column; gap: .5rem; list-style: none; margin: 0; padding: 0; }
      .messages li { display: flex; align-items: center; gap: .35rem; transition: opacity .15s ease; }
      .messages li.own { justify-content: flex-end; }
      .messages li.schedule-marker { justify-content: center; text-align: center; }
      .schedule-marker aside { max-width: 32rem; margin: .5rem; color: var(--text-muted, #666); font-size: .9rem; }
      .schedule-marker strong, .schedule-marker small { display: block; }
      .message-bubble { box-sizing: border-box; width: fit-content; min-width: 0; max-width: min(80%, 32rem); margin: 0; padding: .55rem .8rem; border-radius: 1rem 1rem 1rem .25rem; background: var(--background-alt); }
      .messages li.own .message-bubble { border-radius: 1rem 1rem .25rem 1rem; background: color-mix(in srgb, var(--links) 16%, var(--background)); }
      .messages header { font-size: .9em; }
      .messages time { color: var(--text-muted, #666); font-size: .85em; }
      .messages p { margin: .2rem 0; white-space: pre-wrap; overflow-wrap: anywhere; }
      .messages footer { display: flex; justify-content: flex-start; align-items: center; gap: .3rem; min-height: 1.25rem; }
      .messages li.own footer { justify-content: flex-end; }
      .delivery-status { box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; flex: none; width: 1.1rem; height: 1.1rem; border: 1px solid currentColor; border-radius: 50%; color: var(--text-muted, #666); font-size: .8rem; line-height: 1; }
      .delivery-status.sending { border-top-color: transparent; animation: spin .8s linear infinite; }
      .delivery-status.sent, .delivery-status.saved { border-color: transparent; }
      .delivery-status.failed { color: #a43d31; }
      .message-actions-trigger { flex: none; box-sizing: border-box; width: 2rem; height: 2rem; margin: 0; padding: 0; border: 0; border-radius: .4rem; background: transparent; color: var(--text-muted, #666); font-size: 1.4rem; line-height: 1; opacity: 0; }
      .messages li.own:hover .message-actions-trigger, .messages li.own:focus-within .message-actions-trigger, .message-actions-trigger[aria-expanded="true"] { opacity: 1; }
      .message-actions-trigger:focus-visible { background: var(--button-hover); }
      .message-scrim { position: fixed; inset: 0; z-index: 9; background: transparent; touch-action: none; }
      .message-actions-menu { position: fixed; z-index: 10; box-sizing: border-box; min-width: 6rem; padding: .25rem; border: 1px solid var(--border); border-radius: .5rem; background: var(--background); box-shadow: 0 .4rem 1rem #0003; }
      .message-actions-menu button { box-sizing: border-box; width: 100%; margin: 0; }
      .chat-log.press-menu-open .messages li:not(.selected) { opacity: .25; }
      .messages li.selected { position: relative; z-index: 1; }
      @media (hover: none) and (pointer: coarse) {
        .message-actions-trigger { display: none; }
        .messages li.own .message-bubble,
        .messages li.own .message-bubble * {
          -webkit-touch-callout: none;
          -webkit-user-select: none;
          user-select: none;
        }
      }
      .messages small { display: block; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .delivery-status.sending { animation: none; border-top-color: currentColor; }
        .messages li { transition: none; }
      }
      .chat-suggestions { --edge-fade: 2rem; display: flex; align-items: center; gap: .25rem; min-width: 0; padding: .5rem 1rem 0; overflow-x: auto; overflow-y: hidden; touch-action: pan-x; scrollbar-width: none; }
      .chat-suggestions > span { flex: none; color: var(--text-muted, #666); font-size: .8rem; }
      .chat-suggestions::-webkit-scrollbar, .chat-title::-webkit-scrollbar { display: none; }
      .chat-suggestions.more-left, .chat-title.more-left { mask-image: linear-gradient(to right, transparent, black var(--edge-fade)); }
      .chat-suggestions.more-right, .chat-title.more-right { mask-image: linear-gradient(to right, black calc(100% - var(--edge-fade)), transparent); }
      .chat-suggestions.more-left.more-right, .chat-title.more-left.more-right { mask-image: linear-gradient(to right, transparent, black var(--edge-fade), black calc(100% - var(--edge-fade)), transparent); }
      .chat-suggestions button { flex: none; margin: 0; padding: .2rem .55rem; border: 1px solid var(--border); border-radius: 1rem; background: transparent; color: var(--text-muted, #666); font-size: .8rem; }
      .chat-suggestions button:focus-visible { background: var(--background-alt); }
      @media (hover: hover) and (pointer: fine) {
        .room-list a:hover { background: var(--button-hover); }
        .inactive-rooms a:hover, .chat-suggestions button:hover { background: var(--background-alt); }
        .profile-card a:hover { background: var(--button-hover); }
        .chat-heading h1 a:hover { text-decoration: underline; }
        .message-actions-trigger:hover { background: var(--button-hover); }
      }
      .chat form { display: flex; align-items: flex-end; gap: .5rem; margin: 0; padding: .75rem 1rem 1rem; }
      .chat-suggestions + form { padding-top: .5rem; }
      .chat form.login-form { padding: .5rem; }
      .chat form.login-form button { flex: 1; }
      .chat form textarea { box-sizing: border-box; flex: 1; min-width: 0; min-height: 2.5rem; max-height: 9rem; margin: 0; resize: none; overflow-y: auto; }
      .chat form button { margin: 0; }
      @media (max-width: 40rem) {
        .chat > header { padding: .5rem .65rem 0; }
        .chat-heading { gap: .4rem; }
        .chat-context { margin-bottom: .3rem; }
        .chat-log { padding: .35rem .65rem; }
        .chat-suggestions { --edge-fade: 1.5rem; padding: .3rem .65rem 0; }
        .chat form { padding: .45rem .65rem .6rem; }
        .chat-suggestions + form { padding-top: .35rem; }
      }
    </style>
    <script type="module">
      import { computed, createApp, nextTick, onMounted, onScopeDispose, reactive, ref, watch } from "vue";
      import {
        GraffitiPlugin,
        useGraffiti,
        useGraffitiDiscover,
        useGraffitiSession,
      } from "@graffiti-garden/wrapper-vue";

      // This instance uses a conference-specific channel. Other chats can
      // render the same component with a different channel and title.
      const hallwayChannel = "cscw-meta:2026:hallway:v1";
      // Profiles are discoverable through this conference directory.
      const profilesChannel = "cscw-meta:2026:people:v1";
      const programListUrl = "https://files.sigchi.org/conference/cache/program-list";
      const roomSuggestions = [
        { label: "Meet after", draft: "Anyone want to meet after this session to discuss " },
        { label: "Praise", draft: "I loved the point about " },
        { label: "Clarify", draft: "Could someone clarify what was said about " },
        { label: "Citation", draft: "Could someone point me to a paper or reference on " },
      ];
      const messageSchema = {
        properties: {
          value: {
            type: "object",
            required: ["content", "time"],
            properties: {
              content: { type: "string", minLength: 1 },
              time: { type: "number" },
            },
          },
        },
      };
      const profileSchema = {
        properties: {
          value: {
            type: "object",
            required: ["name", "research interests", "open to meeting", "time"],
            properties: {
              name: { type: "string", minLength: 1 },
              "research interests": { type: "string", minLength: 1 },
              pronouns: { type: "string" },
              "profile picture": { type: "string" },
              "presentation IDs": {
                type: "array",
                items: { type: "number" },
              },
              "open to meeting": { type: "boolean" },
              "how to reach me": { type: "string" },
              time: { type: "number" },
            },
          },
        },
      };
      // Stable actor addresses let people share profiles directly.
      function profileHref(actor) {
        return `?/people/profile/${encodeURIComponent(actor)}`;
      }
      const editorHref = "?/people/edit";
      const timeFormatter = new Intl.DateTimeFormat(undefined, {
        hour: "numeric", minute: "2-digit",
      });
      const ChatRoom = {
        template: "#chat-room-template",
        props: {
          channel: { type: String, required: true },
          title: { type: String, required: true },
          href: { type: String, default: "" },
          backHref: { type: String, default: "" },
          context: { type: Object, default: null },
          markers: { type: Array, default: () => [] },
          markerTimeZone: { type: String, default: "" },
          suggestions: { type: Array, default: () => [] },
          // Only the active room should run the expensive live poll.
          autopoll: { type: Boolean, default: false },
        },
        setup(props) {
          const graffiti = useGraffiti();
          const session = useGraffitiSession();
          const { objects, isFirstPoll, error: discoveryError } = useGraffitiDiscover(
            () => [props.channel], messageSchema, undefined, () => props.autopoll,
          );
          const draft = ref("");
          const untouchedSuggestion = ref("");
          const canSend = computed(() => !!draft.value.trim() &&
            draft.value.trim() !== untouchedSuggestion.value.trim());
          const pending = ref([]);
          const accountBusy = ref(false);
          const accountError = ref("");
          const messageList = ref(null);
          const messageInput = ref(null);
          const deletingUrls = reactive(new Set());
          const deletedUrls = reactive(new Set());
          const deleteErrors = reactive(new Map());
          const actionMenu = ref(null);
          const actionMenuButton = ref(null);
          const touchMenuMedia = window.matchMedia("(hover: none) and (pointer: coarse)");
          let lastMessageTime = 0;
          let pressTimer;
          let pressStart;

          // The fades appear only when more content is available in that direction.
          function trackHorizontalScroll() {
            const element = ref(null);
            const moreLeft = ref(false);
            const moreRight = ref(false);
            function update() {
              const row = element.value;
              if (!row) return;
              moreLeft.value = row.scrollLeft > 1;
              moreRight.value = row.scrollLeft + row.clientWidth < row.scrollWidth - 1;
            }
            const observer = new ResizeObserver(update);
            watch(element, (row, previous) => {
              if (previous) observer.unobserve(previous);
              if (row) {
                observer.observe(row);
                nextTick(update);
              }
            });
            onScopeDispose(() => observer.disconnect());
            return { element, moreLeft, moreRight, update };
          }
          const { element: suggestionList, moreLeft: suggestionsMoreLeft,
            moreRight: suggestionsMoreRight, update: updateSuggestionEdges } =
            trackHorizontalScroll();
          const { element: sessionTitle, moreLeft: sessionMoreLeft,
            moreRight: sessionMoreRight, update: updateSessionEdges } =
            trackHorizontalScroll();
          watch(() => props.suggestions, () => nextTick(updateSuggestionEdges), { flush: "post" });
          watch(() => props.title, async () => {
            await nextTick();
            if (sessionTitle.value) sessionTitle.value.scrollLeft = 0;
            updateSessionEdges();
          }, { flush: "post" });

          // Keep an optimistic copy until discovery contains the saved object.
          // Consecutive local sends get distinct timestamps for matching.
          const messageItems = computed(() => {
            const saved = objects.value.filter((object) => !deletedUrls.has(object.url))
              .map((object) => ({
                key: object.url,
                url: object.url,
                actor: object.actor,
                content: object.value.content,
                time: object.value.time,
                status: "saved",
              }));
            const savedMessages = new Set(saved.map((message) =>
              `${message.actor}\u0000${message.content}\u0000${message.time}`
            ));
            return [...saved, ...pending.value.filter((message) =>
              !deletedUrls.has(message.url) &&
              !savedMessages.has(`${message.actor}\u0000${message.content}\u0000${message.time}`)
            )].sort((a, b) => a.time - b.time ||
              a.key.localeCompare(b.key));
          });
          const timelineItems = computed(() => [...props.markers, ...messageItems.value]
            .sort((a, b) => a.time - b.time ||
              (a.kind !== b.kind ? a.kind === "marker" ? -1 : 1 :
                a.key.localeCompare(b.key))));
          const markerTimeFormatter = computed(() => new Intl.DateTimeFormat(undefined, {
            weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit",
            timeZone: props.markerTimeZone || undefined,
          }));

          onMounted(() => {
            const log = messageList.value;
            if (log) log.scrollTop = log.scrollHeight;
          });
          watch(messageInput, (input) => {
            input?.focus({ preventScroll: true });
          }, { flush: "post" });
          watch(() => timelineItems.value.length, async () => {
            const log = messageList.value;
            if (!log) return;
            const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 96;
            await nextTick();
            if (nearBottom) log.scrollTop = log.scrollHeight;
          });

          async function logIn() {
            accountBusy.value = true;
            accountError.value = "";
            try { await graffiti.login(); }
            catch (error) { accountError.value = error.message || "Could not log in."; }
            finally { accountBusy.value = false; }
          }

          async function postMessage(message) {
            const currentSession = session.value;
            if (!currentSession || currentSession.actor !== message.actor) return;
            message.status = "sending";
            message.error = "";
            try {
              const posted = await graffiti.post({
                value: {
                  content: message.content,
                  time: message.time,
                },
                channels: [props.channel],
              }, currentSession);
              message.url = posted.url;
              message.status = "sent";
            } catch (error) {
              message.status = "failed";
              message.error = error.message || "Could not send this message.";
            }
          }

          function sendMessage() {
            const content = draft.value.trim();
            if (!session.value || !canSend.value || content.length > 1000) return;
            closeActions();
            lastMessageTime = Math.max(Date.now(), lastMessageTime + 1);
            const message = reactive({
              key: `pending:${lastMessageTime}`,
              actor: session.value.actor,
              content,
              time: lastMessageTime,
              status: "sending",
              error: "",
            });
            pending.value.push(message);
            draft.value = "";
            untouchedSuggestion.value = "";
            nextTick(() => {
              resizeComposer();
              messageInput.value?.focus();
            });
            postMessage(message);

            const currentSession = session.value;
            if (!currentSession || currentSession.actor !== message.actor ||
              !message.url || deletingUrls.has(message.url)) return;
            deletingUrls.add(message.url);
            deleteErrors.delete(message.url);
            try {
              await graffiti.delete(message.url, currentSession);

        });
        const selectedChannel = computed(() => routeAddress.value === "hallway"
          ? hallwayChannel : selectedRoom.value
            ? `cscw-meta:2026:room:${selectedRoom.value.id}:v1` : null);

        onMounted(() => { syncRoute(); loadProgram(); });
        return {
          program, programLoading, programError, loadProgram,
          routeAddress, editorRoute, profileRoute, profileActor, homeTab,
          profileSaved, profileRemoved,
          routeRoomId, activeRooms, inactiveRooms,
          selectedTitle, selectedHref, selectedContext, selectedSuggestions,
          selectedMarkers, selectedChannel,
          conferenceTimeZone, timeUntil,
        };
      }

      createApp({
        template: "#app-template",
        components: { ChatRoom, PeopleDirectory },
        setup,
      })
        .use(GraffitiPlugin, { graffiti: new window.Graffiti() })
        .mount("#app");
    </script>
  </head>
  <body>
    <div id="app"><p>Loading…</p></div>

    <template id="app-template">
      <main>
        <template v-if="!routeAddress || routeAddress === 'people' || editorRoute || profileRoute">
          <nav v-if="!editorRoute && !profileRoute" class="home-tabs" aria-label="Home sections">
            <a href="?/" :aria-current="homeTab === 'chat' ? 'page' : null">Chat</a>
            <a href="?/people" :aria-current="homeTab === 'people' ? 'page' : null">People</a>
          </nav>
        <nav v-if="homeTab === 'chat'" class="room-browser" aria-label="Chat rooms">
          <h1>Happening now</h1>
          <ul class="room-list">
            <li><a href="?/hallway"><strong>The Hallway Track</strong></a></li>
            <li v-for="room in activeRooms" :key="room.id">
              <a :href="`?/room/${room.id}`">
                <strong>{{ room.current.name }}</strong>
                <small><span class="room-location"><svg viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" aria-hidden="true">
                  <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z" />
                  <circle cx="12" cy="10" r="2.5" />
                </svg>{{ room.name }}</span> · {{ timeUntil(room.current.endDate) }} left</small>
              </a>
            </li>
          </ul>
          <p v-if="programLoading" role="status">Loading rooms…</p>
          <p v-else-if="programError" role="status">
            {{ programError }} <button type="button" @click="loadProgram">Retry</button>
          </p>
          <template v-else-if="program">
            <p v-if="!activeRooms.length">No scheduled sessions in progress.</p>
            <details>
              <summary>Inactive rooms ({{ inactiveRooms.length }})</summary>
              <ul class="inactive-rooms">
                <li v-for="room in inactiveRooms" :key="room.id">
                  <a :href="`?/room/${room.id}`">
                    <strong v-if="room.last">{{ room.last.name }}</strong>
                    <strong v-else-if="room.next">{{ room.next.name }}</strong>
                    <small><span class="room-location"><svg viewBox="0 0 24 24" fill="none"
                      stroke="currentColor" stroke-width="2" stroke-linecap="round"
                      stroke-linejoin="round" aria-hidden="true">
                      <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z" />
                      <circle cx="12" cy="10" r="2.5" />
                    </svg>{{ room.name }}</span> · {{ room.last ? 'Last session' : 'Next session' }}</small>
                  </a>
                </li>
              </ul>
            </details>
          </template>
        </nav>
        <people-directory v-else :program="program" :program-loading="programLoading"
          :program-error="programError" :editor-route="editorRoute"
          :profile-route="profileRoute" :profile-actor="profileActor"
          @saved="profileSaved" @removed="profileRemoved"></people-directory>
        </template>
        <template v-else>
          <!-- Key by channel so local chat state cannot leak between rooms. -->
          <chat-room v-if="selectedChannel" :key="selectedChannel"
            :channel="selectedChannel" :title="selectedTitle"
            :href="selectedHref" back-href="?/"
            :context="selectedContext" :markers="selectedMarkers"
            :suggestions="selectedSuggestions"
            :marker-time-zone="conferenceTimeZone"
            :autopoll="true"></chat-room>
          <template v-else>
            <p><a href="?/">← Back to rooms</a></p>
            <p v-if="routeRoomId !== null && programLoading" role="status">Loading room…</p>
            <p v-else-if="routeRoomId !== null && programError" role="status">
              {{ programError }} <button type="button" @click="loadProgram">Retry</button>
            </p>
            <p v-else role="status">Room not found.</p>
          </template>
        </template>
      </main>
    </template>

    <template id="people-directory-template">
      <section class="people-directory"
        :aria-label="editorRoute ? 'Profile editor' : profileRoute ? 'Profile' : 'People directory'">
        <header v-if="editorRoute" class="profile-page-header">
          <a class="chat-back" :href="myProfile ? profileHref(myProfile.actor) : '?/people'"
            :aria-label="myProfile ? 'Back to profile' : 'Back to people'" title="Back">←</a>
          <h1>{{ myProfile ? 'Edit your profile' : 'Introduce yourself' }}</h1>
        </header>
        <header v-else-if="profileRoute" class="profile-page-header">
          <a class="chat-back" href="?/people" aria-label="Back to people"
            title="Back to people">←</a>
          <h1>Profile</h1>
        </header>
        <header v-else>
          <h1>People</h1>
        </header>
        <p v-if="notice" role="status">{{ notice }}</p>
        <p v-if="error" role="alert">{{ error }}</p>
        <button v-if="editorRoute && session === null" class="introduce-button"
          type="button" @click="logIn">Log in to introduce yourself</button>
        <p v-else-if="editorRoute && isFirstPoll && !discoveryError" role="status">
          Loading profile…
        </p>

        <form v-if="editorRoute && editing" class="profile-form" @submit.prevent="saveProfile">
          <label>Name
            <input v-model="name" type="text" autocomplete="name" maxlength="100" required>
          </label>
          <label class="profile-photo-picker">
            <span class="profile-avatar profile-photo-preview">
              <img v-if="photoPreview" :src="photoPreview" alt="Selected profile picture">
              <graffiti-get-media v-else-if="myProfile?.value['profile picture'] && !removePhoto"
                :url="myProfile.value['profile picture']"
                :accept="{ types: ['image/*'], maxBytes: maxPhotoBytes }" v-slot="{ media }">
                <img v-if="media" :src="media.dataUrl" alt="Current profile picture">
                <span v-else aria-hidden="true">{{ name.slice(0, 1) || '+' }}</span>
              </graffiti-get-media>
              <span v-else aria-hidden="true">+</span>
            </span>
            <span>{{ photoPreview || (myProfile?.value['profile picture'] && !removePhoto)
              ? 'Change profile picture' : 'Add profile picture (optional)' }}</span>
            <input ref="photoInput" class="profile-photo-input" type="file" accept="image/*"
              @change="selectPhoto">
          </label>
          <button v-if="photoPreview || (myProfile?.value['profile picture'] && !removePhoto)"
            type="button" @click="clearPhoto">Remove picture</button>
          <label>Pronouns (optional)
            <input v-model="pronouns" type="text" autocomplete="off" maxlength="50">
          </label>
          <label>What are your research interests? (1–2 sentences)
            <textarea v-model="interests" rows="3" maxlength="300" required></textarea>
          </label>
          <fieldset>
            <legend>Are you presenting anything?</legend>
            <input v-model="presentationSearch" type="search" autocomplete="off"
              aria-label="Search presentations" placeholder="Search titles or authors"
              :disabled="!program">
            <p v-if="programLoading" role="status">Loading program…</p>
            <p v-else-if="programError" role="status">Program search is unavailable right now.</p>
            <ul v-if="presentations.length">
              <li v-for="id in presentations" :key="id">
                <button class="paper-added" type="button" @click="removePresentation(id)"
                  :aria-label="`Remove ${presentationTitle(id)}`">Added</button>
                {{ presentationTitle(id) }}<small v-if="presentationAuthors(id)">
                  — {{ presentationAuthors(id) }}
                </small>
              </li>
            </ul>
            <ul v-if="presentationMatches.length">
              <li v-for="item in presentationMatches" :key="item.id">
                <button class="paper-add" type="button" @click="addPresentation(item)"
                  :aria-label="`Add ${item.title}`">Add</button>
                {{ item.title }}<small v-if="item.authors"> — {{ item.authors }}</small>
              </li>
            </ul>
            <p v-else-if="presentationSearch.trim().length >= 2 && program?.contents &&
              !matchingPresentations.length">No matches.</p>
          </fieldset>
          <fieldset>
            <legend>Are you interested in meeting other researchers?</legend>
            <label><input v-model="openToMeeting" type="radio" name="open-to-meeting"
              :value="true" required> Yes! I want to meet other researchers</label>
            <label><input v-model="openToMeeting" type="radio" name="open-to-meeting"
              :value="false" required> No, not right now</label>
          </fieldset>
          <div v-if="openToMeeting === true">
            <label for="profile-contact">How should researchers reach out to you?</label>
            <small id="contact-help">
              You can share an email, messaging handle, or where to find you in person.
              What you write here will be public.
            </small>
            <textarea id="profile-contact" v-model="contact" rows="2" maxlength="300"
              required aria-describedby="contact-help"></textarea>
          </div>
          <div class="profile-form-actions">
            <button type="submit" :disabled="busy">{{ busy ? 'Saving…' : 'Save profile' }}</button>
          </div>
        </form>

        <template v-if="profileRoute">
          <p v-if="isFirstPoll && !discoveryError" role="status">Loading profile…</p>
          <p v-else-if="!selectedProfile && !discoveryError" role="status">Profile not found.</p>
          <article v-if="selectedProfile" class="profile-detail">
            <header class="profile-identity">
              <div class="profile-avatar">
                <graffiti-get-media v-if="selectedProfile.value['profile picture']"
                  :url="selectedProfile.value['profile picture']"
                  :accept="{ types: ['image/*'], maxBytes: maxPhotoBytes }"
                  v-slot="{ media }">
                  <img v-if="media" :src="media.dataUrl" alt="">
                  <span v-else aria-hidden="true">{{ selectedProfile.value.name.slice(0, 1) }}</span>
                </graffiti-get-media>
                <span v-else aria-hidden="true">{{ selectedProfile.value.name.slice(0, 1) }}</span>
              </div>
              <div>
                <h2>{{ selectedProfile.value.name }}
                  <small v-if="selectedProfile.value.pronouns">({{ selectedProfile.value.pronouns }})</small>
                </h2>
                <graffiti-actor-to-handle :actor="selectedProfile.actor" v-slot="{ handle }">
                  <small v-if="handle" class="profile-handle">@{{ handle.replace(/^@/, '') }}</small>
                </graffiti-actor-to-handle>
              </div>
            </header>
            <div v-if="selectedProfile.value['presentation IDs']?.length || selectedProfile.value['open to meeting']"
              class="profile-badges">
              <span v-if="selectedProfile.value['open to meeting']" class="meeting">🤝 Open to meeting</span>
              <span v-if="selectedProfile.value['presentation IDs']?.length" class="presenter">🎤 Presenter</span>
            </div>
            <section>
              <h3>Research interests</h3>
              <p><template v-for="(part, index) in researchParts(selectedProfile.value['research interests'])"
                :key="index"><a v-if="isResearchLink(part)" :href="part">{{ part }}</a><template
                v-else>{{ part }}</template></template></p>
            </section>
            <section v-if="selectedProfile.value['presentation IDs']?.length">
              <h3>Presenting</h3>
              <ul>
                <li v-for="id in selectedProfile.value['presentation IDs']" :key="id">
                  {{ presentationTitle(id) }}<small v-if="presentationAuthors(id)">
                    — {{ presentationAuthors(id) }}</small>
                </li>
              </ul>
            </section>
            <section v-if="selectedProfile.value['open to meeting']">
              <h3>How to reach me</h3>
              <p>{{ selectedProfile.value['how to reach me'] }}</p>
            </section>
            <div v-if="selectedProfile.actor === session?.actor" class="profile-actions">
              <button class="profile-edit" type="button" :disabled="busy"
                @click="openEditor">Edit profile</button>
              <button type="button" :disabled="busy" @click="removeProfile">
                {{ busy ? 'Deleting…' : 'Delete profile' }}
              </button>
            </div>
          </article>
        </template>

        <template v-if="!editorRoute && !profileRoute">
        <div v-if="profiles.length" class="people-search" role="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle><path d="m16 16 5 5"></path>
          </svg>
          <input v-model="search" type="search" autocomplete="off"
            aria-label="Search people" placeholder="Name, interest, or presentation">
        </div>
        <fieldset v-if="profiles.length" class="people-filters" aria-label="Filter people">
          <label class="meeting"><input v-model="meetingOnly" type="checkbox"> 🤝 Open to meeting</label>
          <label class="presenter"><input v-model="presentersOnly" type="checkbox"> 🎤 Presenters</label>
        </fieldset>
        <a v-if="!isFirstPoll && session && !myProfile"
          class="introduce-button" :href="editorHref">Introduce yourself</a>
        <button v-else-if="session === null" class="introduce-button"
          type="button" @click="logIn">Log in to introduce yourself</button>
        <p v-if="discoveryError" role="status">
          Could not load profiles: {{ discoveryError.message }}. Retrying…
        </p>
        <p v-else-if="isFirstPoll" role="status">Loading people…</p>
        <p v-else-if="!profiles.length">No profiles yet. Introduce yourself!</p>
        <p v-else-if="!visibleProfiles.length">No people match that search.</p>
        <ul v-if="visibleProfiles.length" class="profile-list">
          <li v-for="profile in visibleProfiles" :key="profile.actor">
            <article class="profile-card">
              <a :href="profileHref(profile.actor)">
                <header class="profile-identity">
                  <div class="profile-avatar">
                    <graffiti-get-media v-if="profile.value['profile picture']"
                      :url="profile.value['profile picture']"
                      :accept="{ types: ['image/*'], maxBytes: maxPhotoBytes }"
                      v-slot="{ media }">
                      <img v-if="media" :src="media.dataUrl" alt="">
                      <span v-else aria-hidden="true">{{ profile.value.name.slice(0, 1) }}</span>
                    </graffiti-get-media>
                    <span v-else aria-hidden="true">{{ profile.value.name.slice(0, 1) }}</span>
                  </div>
                  <div>
                    <h2>{{ profile.value.name }}
                      <small v-if="profile.value.pronouns">({{ profile.value.pronouns }})</small>
                    </h2>
                    <graffiti-actor-to-handle :actor="profile.actor" v-slot="{ handle }">
                      <small v-if="handle" class="profile-handle">@{{ handle.replace(/^@/, '') }}</small>
                    </graffiti-actor-to-handle>
                  </div>
                </header>
                <div v-if="profile.value['presentation IDs']?.length || profile.value['open to meeting']"
                  class="profile-badges">
                  <span v-if="profile.value['open to meeting']" class="meeting">🤝 Open to meeting</span>
                  <span v-if="profile.value['presentation IDs']?.length" class="presenter">🎤 Presenter</span>
                </div>
                <p>{{ profile.value['research interests'] }}</p>
              </a>
            </article>
          </li>
        </ul>
        </template>
      </section>
    </template>

    <template id="chat-room-template">
      <section class="chat" :aria-label="title">
        <header>
          <div class="chat-heading">
            <a v-if="backHref" class="chat-back" :href="backHref"
              aria-label="Back to rooms" title="Back to rooms">←</a>
            <div class="chat-heading-content">
              <h1 ref="sessionTitle" class="chat-title"
                :class="{ 'more-left': sessionMoreLeft, 'more-right': sessionMoreRight }"
                @scroll="updateSessionEdges"><a v-if="href" :href="href">{{ title }}</a><template v-else>{{ title }}</template></h1>
              <p v-if="context" class="chat-context">
                <span>{{ context.room }}</span>
                <template v-if="context.time"><span aria-hidden="true">·</span><span>{{ context.time }}</span></template>
              </p>
            </div>
          </div>
        </header>

        <section ref="messageList" class="chat-log"
          :class="{ 'menu-open': actionMenu, 'press-menu-open': actionMenu?.mode === 'press' }"
          :aria-label="`${title} messages`"
          role="log" aria-live="polite" aria-relevant="additions">
          <p v-if="discoveryError" role="status">
            Could not load messages: {{ discoveryError.message }}. Retrying…
          </p>
          <p v-if="isFirstPoll && !discoveryError" role="status">Loading messages…</p>
          <p v-if="!isFirstPoll && !timelineItems.length && !discoveryError">
            No messages yet. Start the conversation.
          </p>
          <ol v-if="timelineItems.length" class="messages">
            <template v-for="message in timelineItems" :key="message.key">
              <li v-if="message.kind === 'marker'" class="schedule-marker">
                <aside>
                  <small><time :datetime="dateTime(message.time)">{{ formatMarkerTime(message.time) }}</time>
                    · {{ message.label }}</small>
                  <strong>{{ message.title }}</strong>
                  <small v-if="message.detail">{{ message.detail }}</small>
                </aside>
              </li>
              <li v-else
                :class="{ own: message.actor === session?.actor,
                  selected: actionMenu?.mode === 'press' && actionMenu.message.key === message.key }"
                :style="actionMenu?.mode === 'press' && actionMenu.message.key === message.key
                  ? { transform: `translateY(-${actionMenu.lift}px)` } : null">
                <button v-if="message.actor === session?.actor" class="message-actions-trigger"
                  type="button" aria-label="Message actions" title="Message actions"
                  :aria-expanded="actionMenu?.message.key === message.key"
                  @click="openActionsFromButton(message, $event)">⋯</button>
                <article class="message-bubble" @pointerdown="startLongPress(message, $event)"
                  @pointermove="moveLongPress" @pointerup="clearLongPress"
                  @pointercancel="clearLongPress" @pointerleave="clearLongPress"
                  @selectstart="onMessageSelectStart(message, $event)"
                  @contextmenu="onMessageContextMenu(message, $event)">
                  <header v-if="message.actor !== session?.actor">
                    <strong>
                      <graffiti-actor-to-handle :actor="message.actor" v-slot="{ handle }">
                        {{ handle || 'Account' }}
                      </graffiti-actor-to-handle>
                    </strong>
                  </header>
                  <p><template v-for="(part, index) in textParts(message.content)" :key="index"><a
                    v-if="isLink(part)" :href="part">{{ part }}</a><template
                    v-else>{{ part }}</template></template></p>
                  <footer>
                    <time :datetime="dateTime(message.time)">{{ formatTime(message.time) }}</time>
                    <span v-if="message.actor === session?.actor" class="delivery-status"
                      :class="message.status" :aria-label="deliveryLabel(message.status)"
                      :title="deliveryLabel(message.status)">
                      {{ message.status === 'sending' ? '' : message.status === 'failed' ? '!' : '✓' }}
                    </span>
                  </footer>
                  <small v-if="message.status === 'failed'" role="alert">
                    {{ message.error }}
                    <button type="button" :disabled="session?.actor !== message.actor"
                      @click="postMessage(message)">Retry</button>
                  </small>
                  <small v-if="deleteErrors.has(message.url)" role="alert">
                    {{ deleteErrors.get(message.url) }}
                  </small>
                </article>
              </li>
            </template>
          </ol>
        </section>

        <div v-if="actionMenu" class="message-scrim" aria-hidden="true"
          @click="closeActions" @wheel.prevent @touchmove.prevent></div>
        <div v-if="actionMenu" class="message-actions-menu"
          :style="{ left: actionMenu.left + 'px', top: actionMenu.top + 'px' }">
          <button ref="actionMenuButton" type="button"
            :disabled="actionMenu.message.status === 'sending' || deletingUrls.has(actionMenu.message.url)"
            @click="deleteFromMenu">Delete</button>
        </div>

        <div v-if="session && !draft.trim() && suggestions.length" class="chat-suggestions"
          ref="suggestionList" role="group" aria-label="Suggestions"
          :class="{ 'more-left': suggestionsMoreLeft, 'more-right': suggestionsMoreRight }"
          @scroll="updateSuggestionEdges">
          <span aria-hidden="true">Suggestions</span>
          <button v-for="suggestion in suggestions" :key="suggestion.label" type="button"
            @click="useSuggestion(suggestion)">{{ suggestion.label }}</button>
        </div>
        <form autocomplete="off" :class="{ 'login-form': session === null }"
          @submit.prevent="sendMessage">
          <span v-if="session === undefined">Checking your account…</span>
          <button v-else-if="session === null" type="button" :disabled="accountBusy"
            @click="logIn">Log in to chat</button>
          <template v-else>
            <textarea ref="messageInput" v-model="draft" rows="1"
              aria-label="Message" placeholder="Message" autocomplete="off" maxlength="1000"
              enterkeyhint="send" @focus="closeActions" @input="resizeComposer"
              @keydown="onComposerKeydown"></textarea>
          </template>
        </form>
        <p v-if="accountError" role="alert">{{ accountError }}</p>
      </section>
    </template>
  </body>
</html>
